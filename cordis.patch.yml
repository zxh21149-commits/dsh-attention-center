# dsh-attention-center 0.3.x —— PTC 增强套件（一个安装包，三块能力）
#
#   1) attention-core  注意力中心：运行中计数 / 失败·完成提醒 / 跨会话答题弹窗 / 手机推送
#   2) inquiry-core    刨根问底：注册 inquiry-mode 技能与 /pao /pau /inquiry 命令
#   3) preset-inquiry  「刨根问底 · Inquiry」预设，跑在 PTC 上（tool-presentation mode:ptc）
#
# 为什么预设要走 PTC：原生模式下每个工具都是一条独立 schema + 一次往返；PTC 下模型只看到
# run_code + 生成的 SDK，所有工具（含 dsh-ops 的 ops_bash / ops_grep / ops_glob /
# ops_inspect_local_file / ops_replace）都变成 tools.xxx() 在 TypeScript 程序里调用 ——
# 一次程序里可以并发取证，中间结果不进上下文，只把要用的那几行 return 出来。
#
# 提问为什么是 timed：PTC 下 run_code 有自己的执行期限（默认 120s，见下面 ptc-runtime 覆盖）。
# 阻塞式提问一旦被期限打断，官方 README 写明「该问题可能丢失」；timed 到点先返回 pending，
# 题还留着、随时可答，答案随后作为用户消息回来。
#
# 回退：删掉下面所有行（或整份替换回旧 patch）后重启。

# 5 分钟等待 > 默认 120s，必须把 run_code 的默认期限抬到 330s（比 ask 的 300s 多 30s 余量）。
# 这一条是全局的：所有 PTC 预设的 run_code 默认期限都会变成 5.5 分钟。
- id: ptc-runtime
  name: '@deepseek-ai/dsh-ptc-runtime-node'
  config:
    timeoutMs: 330000
    maxTimeoutMs: 600000

- insert:
    - id: attention-core
      name: 'dsh-attention-center'
      config:
        notifyProvider: none
        notifyPushplusToken: ''
        notifyWecomWebhook: ''
        notifyOnError: true
        notifyOnQuestion: true
        notifyQuestionTimeoutMinutes: 5
        notifyOnDone: true
        notifyMinRunSeconds: 300
        notifyTestOnStart: false

    - id: inquiry-core
      name: 'dsh-attention-center/inquiry'
      config:
        rounds: 4
        questionsPerRound: 6
        language: zh
        questionBankPath: ''
        briefDir: ~/.dsh/inquiry
        autoLoadSkill: true

    - id: preset-inquiry
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: inquiry
        order: 5
        name: 刨根问底 · Inquiry
        description: 问答式澄清模式（PTC / run_code）：先问 20~30 个问题、每轮复述理解，把方向钉住再动手。适合"我有个想法但说不清楚"的创造/探索任务。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >
                你是「刨根问底 · Inquiry（PTC）」模式下的创造伙伴，由 {{model}}
                驱动。这个模式只做一件事：在动手之前，用成串的具体问题把方向钉死，再开工。


                本模式跑在 PTC 上：没有原生函数调用，所有工具都在 run_code 里经 SDK 调用（`await tools.<名字>(参数)`）。装了 dsh-ops 时，取证件工具就是
                `ops_bash` / `ops_grep` / `ops_glob` / `ops_inspect_local_file` / `ops_replace` —— 一次 run_code 里并发取证，只把要用的那几行 return 出来，中间结果不进上下文。


                开始前先在 run_code 里用 `tools.skill` 加载 `inquiry-mode` 技能——完整协议、轮数/题数、问题库与《需求简报》模板都在里面，按技能里的配置执行。
                如果技能加载失败：先复述三栏，再给 3 个方向，每轮 5-7 题，收口给《需求简报》，用户确认前不动手。


                提问纪律：一轮的题放在同一次 `tools.ask_user_question` 里，每题给稳定的 id（q1…q6），推荐项放第一并加 (Recommended)。
                它是 timed 模式：5 分钟内答完就直接拿到答案；返回 `pending` 说明用户还在答——立刻结束本回合，不要自答、不要替用户选、不要继续推进；答案会作为下一条用户消息回来，从那里接着做。


                用户只给种子、说不清需求时，不要先给方案，也不要先写代码；用具体选项逼出信息。用户说「够了 / 直接做」立即收口。用用户的语言回复。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: timed
              timeout: 300
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
